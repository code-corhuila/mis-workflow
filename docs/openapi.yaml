openapi: 3.1.0
info:
  title: MediStock - Recepcion integrada
  version: 2.0.0
  description: 'Recepcion integrada con compensacion persistente HU-WFL-002: entradas pendientes se cancelan antes de anular recibos. Stock activado no se revierte; fallos inciertos se reanudan, no se compensan a ciegas.'
servers: [{url: 'http://127.0.0.1:8088'}]
security: [{bearerAuth: []}]
paths:
  /api/v1/sagas/receive-supplies:
    post:
      operationId: startReception
      description: 'ADMIN o INVENTORY. Preparar recibo, preparar entrada, confirmar recibo y activar entrada. Replay solo consulta la saga sin pasos. Rechazos definitivos inician compensacion guardada por recurso: cancelar entrada pendiente, luego anular recibo. Compensacion completa queda COMPENSATED; si falla, FAILED requiere decision administrativa. Tiempo de espera, identidad y conflictos inciertos no disparan compensacion.'
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Reception'}}}}
      responses:
        '201':
          description: Saga creada, con estado vigente despues de ejecutar su avance.
          headers: {Location: {schema: {type: string}, description: '/api/v1/sagas/{id}'}, X-Correlation-Id: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Saga'}}}
        '200': {$ref: '#/components/responses/Saga'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sagas/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: findReceptionSaga
      description: 'ADMIN y SUPERVISOR consultan todas; INVENTORY solo propias. CONSULTATION no accede. No ejecuta pasos.'
      responses: {'200': {$ref: '#/components/responses/Saga'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/sagas/{id}/resume:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: resumeReceptionSaga
      description: 'ADMIN o INVENTORY propietaria. RUNNING continua la fase guardada: avance o compensacion tras caida. Conserva claves, correlacion y SERVICE_TOKEN. COMPLETED, COMPENSATED y FAILED solo devuelven estado. FAILED requiere compensate administrativo; timeout o conflicto de avance no se compensan a ciegas.'
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, maxProperties: 0}}}}
      responses: {'200': {$ref: '#/components/responses/Saga'}, default: {$ref: '#/components/responses/Error'}}
  /api/v1/sagas/{id}/compensate:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: compensateReceptionSaga
      description: 'Solo ADMIN: decision explicita sobre FAILED en fase de compensacion guardada. Reintenta acciones pendientes con claves previas. COMPENSATED es replay sin acciones. RUNNING, COMPLETED y FAILED historico sin fase conocida rechazan 409: requieren resolver resultados inciertos, nunca revertir stock activado.'
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, maxProperties: 0}}}}
      responses: {'200': {$ref: '#/components/responses/Saga'}, default: {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT RS256}
  parameters:
    Id: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
  responses:
    Saga:
      description: Estado guardado; no incluye detalle interno ni credenciales.
      headers: {X-Correlation-Id: {schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Saga'}}}
    Error:
      description: '400 VALIDATION_ERROR, 401 UNAUTHORIZED, 403 FORBIDDEN, 404 NOT_FOUND, 409 IDEMPOTENCY_CONFLICT/SAGA_BUSY, 413 PAYLOAD_TOO_LARGE, 429 TOO_MANY_REQUESTS, 503 SERVICE_UNAVAILABLE/INVALID_SAGA_STATE; otros errores conservan el sobre comun. El adaptador HTTP debe validar JWT y limitar cuerpo/tiempos.'
      headers: {X-Correlation-Id: {schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Uuid: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
    NullableUuid: {anyOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
    Step: {type: string, enum: [prepare-receipt, prepare-entry, confirm-receipt, activate-entry]}
    UndoStep: {type: string, enum: [cancel-entry, void-receipt]}
    Reception:
      type: object
      additionalProperties: false
      required: [supplierId, medicationId, reference, lotNumber, expiresOn, quantity]
      properties:
        supplierId: {$ref: '#/components/schemas/Uuid'}
        medicationId: {$ref: '#/components/schemas/Uuid'}
        reference: {type: string, description: 'Recortada, ASCII alfanumerico/guion de 1 a 40 caracteres y normalizada a mayusculas.'}
        lotNumber: {type: string, description: 'Recortado, ASCII alfanumerico/guion de 1 a 40 caracteres y normalizado a mayusculas.'}
        expiresOn: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
    Saga:
      type: object
      additionalProperties: false
      required: [id, createdBy, createdAt, status, completedSteps, compensatedSteps, failedStep, receiptId, entryId]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        createdBy: {$ref: '#/components/schemas/Uuid'}
        createdAt: {type: string, format: date-time}
        status: {type: string, enum: [RUNNING, COMPLETED, FAILED, COMPENSATED]}
        completedSteps: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/Step'}}
        compensatedSteps: {type: array, maxItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/UndoStep'}}
        failedStep: {anyOf: [{$ref: '#/components/schemas/Step'}, {$ref: '#/components/schemas/UndoStep'}, {type: 'null'}]}
        receiptId: {$ref: '#/components/schemas/NullableUuid'}
        entryId: {$ref: '#/components/schemas/NullableUuid'}
    Error:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: {type: string}
        message: {type: string}
        traceId: {type: string}
        details: {type: array, items: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}}
