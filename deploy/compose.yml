services:
  workflow-db-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    environment:
      PGHOST: postgres
      PGDATABASE: ${PG_DATABASE:?PG_DATABASE required}
      PGUSER: ${PG_ADMIN_USER:?PG_ADMIN_USER required}
      PGPASSWORD_FILE: /run/migration/admin-password
      WORKFLOW_APP_PASSWORD: ${WORKFLOW_APP_PASSWORD:?WORKFLOW_APP_PASSWORD required}
    volumes:
      - type: bind
        source: ${WORKFLOW_ADMIN_PASSWORD_FILE:?WORKFLOW_ADMIN_PASSWORD_FILE required}
        target: /run/migration/admin-password
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]
    restart: 'no'
  workflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      WORKFLOW_PG_HOST: postgres
      WORKFLOW_PG_DATABASE: ${PG_DATABASE:?PG_DATABASE required}
      WORKFLOW_PG_PASSWORD: ${WORKFLOW_APP_PASSWORD:?WORKFLOW_APP_PASSWORD required}
      WORKFLOW_SERVICE_TOKEN_PATH: /run/workflow/service.jwt
      WORKFLOW_PUBLIC_KEY_PATH: /run/workflow/public.pem
      WORKFLOW_SERVICE_SUBJECT: ${WORKFLOW_SERVICE_SUBJECT:?WORKFLOW_SERVICE_SUBJECT required}
      WORKFLOW_KEY_ID: ${WORKFLOW_KEY_ID:?WORKFLOW_KEY_ID required}
      WORKFLOW_JWKS_URL: http://security:8080/api/v1/auth/jwks
      WORKFLOW_SUPPLIERS_URL: http://suppliers:8080
      WORKFLOW_INVENTORY_URL: http://inventory:8080
    volumes:
      - type: bind
        source: ${WORKFLOW_CREDENTIALS_PATH:?WORKFLOW_CREDENTIALS_PATH required}
        target: /run/workflow
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      workflow-db-migrate: {condition: service_completed_successfully}
      security: {condition: service_healthy}
      suppliers: {condition: service_healthy}
      inventory: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=6)"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [platform]
