name: Workflow core checks
on:
  pull_request:
    branches: [develop, qa]
permissions:
  contents: read
concurrency:
  group: workflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Test independent orchestration core
        run: python -m unittest discover -s tests -v
      - name: Test PostgreSQL persistence in an isolated network
        run: docker compose -p workflow-storage-ci -f tests/compose.storage.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove disposable persistence database
        if: always()
        run: docker compose -p workflow-storage-ci -f tests/compose.storage.yml down -v
